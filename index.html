<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be My Valentine ❤️ | E-Postcard</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Padauk:wght@400;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Padauk', 'Outfit', sans-serif;
      overflow-x: hidden;
    }

    .handwriting {
      font-family: 'Dancing Script', 'Padauk', cursive;
    }

    /* Soft Romantic Pastel Gradient Background */
    .soft-romantic-bg {
      background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb, #fbc2eb, #a6c1ee);
      background-size: 400% 400%;
      animation: softGradient 12s ease infinite;
    }

    @keyframes softGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating glowing elements */
    .bg-hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .heart-particle {
      position: absolute;
      bottom: -10vh;
      animation: floatUp linear infinite;
      user-select: none;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.7);
        opacity: 0.9;
      }
      50% {
        opacity: 1;
        filter: drop-shadow(0 0 15px rgba(255, 105, 180, 0.8));
      }
      100% {
        transform: translateY(-115vh) rotate(360deg) scale(1.3);
        opacity: 0;
      }
    }

    /* Envelope Float Down Animation */
    .animate-float-down {
      animation: floatDownFromTop 3.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes floatDownFromTop {
      0% {
        top: -220px;
        transform: translateX(-50%) rotate(-15deg);
        opacity: 0;
      }
      40% {
        transform: translateX(-45%) rotate(12deg);
        opacity: 1;
      }
      70% {
        transform: translateX(-52%) rotate(-6deg);
      }
      100% {
        top: 35%;
        transform: translateX(-50%) rotate(0deg);
        opacity: 1;
      }
    }

    /* Gentle Floating Animation */
    .animate-bounce-gentle {
      animation: bounceGentle 1.4s infinite alternate ease-in-out;
    }

    @keyframes bounceGentle {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-10px) scale(1.05); }
    }

    /* Paper Texture for Letter Modal */
    .paper-texture {
      background: #ffffff;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
    }

    /* Pulse Glow for Buttons */
    .glow-btn-yes {
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.8), 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    .glow-btn-yes:hover {
      box-shadow: 0 0 35px rgba(255, 255, 255, 1), 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    /* Light Glow for Black Text Readability */
    .text-glow-dark {
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
    }
  </style>
</head>

<body class="soft-romantic-bg min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden selection:bg-pink-500 selection:text-white">

  <!-- Background Hearts Particle Container -->
  <div id="heartsContainer" class="bg-hearts"></div>

  <!-- Decorative Floating Background Orbs -->
  <div class="absolute top-10 left-10 w-36 h-36 bg-pink-200 rounded-full blur-3xl opacity-50 animate-pulse pointer-events-none"></div>
  <div class="absolute bottom-10 right-10 w-44 h-44 bg-purple-200 rounded-full blur-3xl opacity-50 animate-pulse pointer-events-none"></div>

  <!-- Main Interactive Postcard Container -->
  <main class="relative z-10 w-full max-w-sm sm:max-w-md p-4 sm:p-6 text-center my-auto">

    <div id="contentBox" class="flex flex-col items-center justify-center min-h-[350px]">
      
      <!-- GIF Display Container -->
      <div class="relative w-52 h-52 sm:w-60 sm:h-60 mb-5">
        <img id="gifImage" 
             src="https://media.tenor.com/6jbVz69zx6kAAAAi/poty.gif" 
             alt="Love Proposal Cute GIF" 
             class="w-full h-full object-cover">
      </div>

      <!-- Myanmar Proposal Question Heading (Black Text) -->
      <h1 id="questionText" class="text-2xl sm:text-3xl font-black text-slate-900 mb-6 leading-relaxed min-h-[3.5rem] flex items-center justify-center px-2 text-glow-dark">
ပြန်လာပေးပါနော် အကဲ ❤️      </h1>

      <!-- Interactive Buttons -->
      <div id="buttonGroup" class="flex flex-wrap items-center justify-center gap-4 w-full">
        <!-- Yes Button (Black Text) -->
        <button id="yesBtn" onclick="handleYesClick()" 
                class="glow-btn-yes bg-white text-slate-900 hover:bg-slate-50 font-black py-3.5 px-9 rounded-full transition-transform duration-300 text-lg sm:text-xl flex items-center gap-2 cursor-pointer shadow-xl">
          <span>Yes</span> 💕
        </button>

        <!-- No Button (Black Text) -->
        <button id="noBtn" onclick="handleNoClick()" 
                class="bg-white/80 hover:bg-white text-slate-900 font-extrabold py-3.5 px-7 rounded-full shadow-lg border border-white/40 transform active:scale-95 transition-all duration-200 text-base sm:text-lg flex items-center gap-1.5 cursor-pointer">
          <span>No</span> 🥺
        </button>
      </div>

      <!-- Stage Dots Indicator -->
      <div class="mt-6 flex gap-2 justify-center items-center" id="dotsContainer">
        <span class="dot w-7 h-2.5 rounded-full bg-slate-900 shadow-lg"></span>
        <span class="dot w-2.5 h-2.5 rounded-full bg-slate-900/40"></span>
        <span class="dot w-2.5 h-2.5 rounded-full bg-slate-900/40"></span>
        <span class="dot w-2.5 h-2.5 rounded-full bg-slate-900/40"></span>
        <span class="dot w-2.5 h-2.5 rounded-full bg-slate-900/40"></span>
      </div>

    </div>
  </main>

  <!-- Floating Envelope Container (Appears after clicking Yes) -->
  <div id="floatingPostcard" 
       onclick="openApologyLetter()" 
       class="fixed left-1/2 -translate-x-1/2 z-40 hidden cursor-pointer flex flex-col items-center group">
    
    <!-- Transparent Animated Envelope Graphic -->
    <div class="relative w-44 h-44 sm:w-52 sm:h-52 filter drop-shadow-[0_15px_25px_rgba(0,0,0,0.3)] transform group-hover:scale-105 transition-transform duration-300">
      <img src="https://i.ibb.co/gZVPsCmG/pngwing-com.png" 
           alt="Floating Envelope" 
           class="w-full h-full object-contain">
    </div>

    <!-- Animated Tap Badge -->
    <div class="bg-white text-slate-900 text-sm font-black px-6 py-2.5 rounded-full shadow-2xl -mt-4 animate-bounce-gentle border border-rose-200 flex items-center gap-2">
      <i class="fa-solid fa-envelope-open-text text-sm text-rose-600"></i> Click to Open Letter ✨
    </div>
  </div>

  <!-- Love Letter Modal Overlay -->
  <div id="letterModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
    
    <!-- Paper Letter Container -->
    <div id="paperLetter" class="paper-texture rounded-3xl w-full max-w-sm sm:max-w-md p-6 sm:p-7 relative transform scale-90 transition-transform duration-300">
      
      <!-- Close Modal Button -->
      <button onclick="closeApologyLetter()" class="absolute top-4 right-4 text-slate-500 hover:text-rose-600 text-xl font-bold w-9 h-9 rounded-full bg-slate-100 hover:bg-rose-100 flex items-center justify-center transition-colors shadow-sm">
        &times;
      </button>

      <!-- Stamp Decor -->
      <div class="absolute top-4 right-14 border-2 border-dashed border-rose-500 rounded-md px-2.5 py-1 text-xs text-rose-600 font-black transform rotate-6 bg-rose-50 shadow-sm flex items-center gap-1">
        <span>💌 LOVE LETTER</span>
      </div>

      <!-- Letter Header -->
      <div class="text-rose-600 font-black text-xl sm:text-2xl mb-4 border-b-2 border-rose-100 pb-3 flex items-center gap-2">
        <span>To my special someone...</span> 🌸
      </div>

      <!-- Letter Body Content -->
      <div class="text-slate-900 text-sm sm:text-base leading-relaxed space-y-3.5 my-4 font-bold">
        <p class="first-letter:text-lg first-letter:font-black first-letter:text-rose-600">
           
        </p> ငါတို့ကြားမှာ အလွဲအမှားတွေရှိခဲ့ရင် တောင်းပန်ပါတယ် အကဲ
        <p>
          နားလည်မှုလွဲတာတွေ လျှော့ပြီး ထပ်မဝေးကြရအောင်နော် အကဲ ..
        </p>
      </div>

      <!-- Footer & Signature -->
      <div class="mt-5 pt-3 border-t border-rose-100 text-right">
        <p class="text-slate-600 text-xs sm:text-sm font-bold">Forever & Always...</p>
        <p class="text-rose-600 font-black text-lg sm:text-xl handwriting mt-1">
          With all my love 💕
        </p>
      </div>

      <!-- Bottom Close / Accept Button -->
      <div class="mt-5 text-center">
        <button onclick="handleFinalAcceptClick()" class="bg-gradient-to-r from-rose-600 to-pink-600 hover:from-rose-700 hover:to-pink-700 text-white font-black px-7 py-3 rounded-full shadow-lg hover:shadow-rose-400/50 transition-all text-sm sm:text-base">
          လက်ခံပါတယ် အမြဲတမ်းအတူရှိမယ် ❤️
        </button>
      </div>

    </div>
  </div>

  <script>
    const FORMSPREE_URL = "https://formspree.io/f/xljjqbdo";

    // 5 Proposal Questions and Matching Cute GIFs
    const proposalData = [
      {
        question: "Please!!!",
        gif: "https://media.tenor.com/RowKT44Zuf0AAAAi/ngoclan.gif"
      },
      {
        question: "တကယ်ပဲ ငြင်းမှာလား...အကဲ 🥺",
        gif: "https://media.tenor.com/fvhG4Kl8Q_kAAAAi/sad.gif"
      },
      {
        question: "စဉ်းစားပါဦး နော်နော်...အကဲ🌸",
        gif: "https://media.tenor.com/fIKMkwShzkUAAAAi/cry.gif"
      },
      {
        question: "မရက်ဆက်ပါနဲ့တော့ အကဲရယ်✨",
        gif: "https://media.tenor.com/UQmC7hXqNzUAAAAi/sad-anxious.gif"
      },
      {
        question: "Yes ပဲ နှိပ်လိုက်ပါတော့နော် အကဲ 😤❤️",
        gif: "https://media.tenor.com/mxFUB2neXSQAAAAi/rabbits.gif"
      }
    ];

    let currentIndex = 0;
    let yesScale = 1;
    let noCount = 0;

    // Helper function to send email notification via Formspree
    function sendFormspreeData(data) {
      fetch(FORMSPREE_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify(data)
      }).catch(err => console.log("Formspree Send Error:", err));
    }

    // Background Floating Hearts Animation Generator
    function createHearts() {
      const heartsContainer = document.getElementById('heartsContainer');
      const heartIcons = ['❤️', '💖', '🌸', '✨', '💕', '💗', '🧸', '🌺', '⭐'];

      for (let i = 0; i < 10; i++) {
        const heart = document.createElement('div');
        heart.classList.add('heart-particle');
        heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
        heart.style.animationDelay = (Math.random() * 5) + 's';
        heart.style.fontSize = (Math.random() * 1.5 + 1.2) + 'rem';
        heartsContainer.appendChild(heart);
      }
    }

    // Handle "No" Button Click - Makes Yes Button Grow Bigger Every Click
    function handleNoClick() {
      noCount++;
      currentIndex = (currentIndex + 1) % proposalData.length;

      const gifImage = document.getElementById('gifImage');
      const questionText = document.getElementById('questionText');
      const yesBtn = document.getElementById('yesBtn');

      // Update image & question text
      gifImage.src = proposalData[currentIndex].gif;
      questionText.innerText = proposalData[currentIndex].question;

      // Increase Yes Button Scale significantly on each click
      yesScale += 0.25;
      yesBtn.style.transform = `scale(${yesScale})`;

      updateDots();
    }

    // Update Stage Dots Indicator
    function updateDots() {
      const dots = document.querySelectorAll('.dot');
      dots.forEach((dot, idx) => {
        if (idx === currentIndex) {
          dot.className = 'dot w-7 h-2.5 rounded-full bg-slate-900 shadow-lg';
        } else {
          dot.className = 'dot w-2.5 h-2.5 rounded-full bg-slate-900/40';
        }
      });
    }

    // Handle "Yes" Button Click
    function handleYesClick() {
      // Send First Email: Yes Clicked + Total No Clicks Count
      sendFormspreeData({
        event: "Love Accepted (Yes Clicked)",
        message: "Yes ခလုတ်ကို နှိပ်ပြီး ချစ်သူအဖြစ်ပြန်လက်ခံလိုက်ပါပြီ!",
        totalNoClicks: noCount,
        time: new Date().toLocaleString()
      });

      const contentBox = document.getElementById('contentBox');

      // Dynamic Confetti Burst
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#ff4d6d', '#ff758f', '#ffb3c1', '#a855f7', '#3b82f6', '#fbbf24']
      });

      // Secondary delay explosion
      setTimeout(() => {
        confetti({
          particleCount: 50,
          angle: 60,
          spread: 50,
          origin: { x: 0 }
        });
        confetti({
          particleCount: 50,
          angle: 120,
          spread: 50,
          origin: { x: 1 }
        });
      }, 250);

      // Celebration Card Content (Black Text)
      contentBox.innerHTML = `
        <div class="flex flex-col items-center">
          <div class="relative w-52 h-52 sm:w-60 sm:h-60 mb-5">
            <img src="https://media.tenor.com/oq1xxckNMhQAAAAi/tonton-tontonsticker.gif" 
                 alt="Happy Celebration GIF" 
                 class="w-full h-full object-cover">
          </div>

          <h2 class="text-2xl sm:text-3xl font-black text-slate-900 mb-2 leading-snug text-glow-dark">
            Yayyy! ချစ်သူတွေ ပြန်ဖြစ်သွားပြီနော်! 🥰💖
          </h2>

          <p class="text-base sm:text-lg text-slate-900 font-black mb-6 text-glow-dark">
            ထပ်မဝေးပဲနေကြရအောင်နော် ✨
          </p>

          <!-- Epostcard Trigger Button -->
          <button onclick="triggerFloatingPostcard()" 
                  class="bg-white text-slate-900 hover:bg-slate-50 font-black py-3.5 px-8 rounded-full shadow-2xl transform hover:-translate-y-0.5 transition-all duration-300 text-base sm:text-lg flex items-center gap-2 cursor-pointer animate-bounce">
            <i class="fa-solid fa-paper-plane text-base text-rose-600"></i> Love Letter for you
          </button>
        </div>
      `;
    }

    // Trigger Envelope Float Down Sequence
    function triggerFloatingPostcard() {
      const floatingEnv = document.getElementById('floatingPostcard');
      floatingEnv.classList.remove('hidden');
      floatingEnv.classList.add('animate-float-down');
    }

    // Open Paper Modal Letter
    function openApologyLetter() {
      const modal = document.getElementById('letterModal');
      const paper = document.getElementById('paperLetter');

      modal.classList.remove('opacity-0', 'pointer-events-none');
      paper.classList.remove('scale-90');
      paper.classList.add('scale-100');

      // Burst confetti when opening letter
      confetti({
        particleCount: 70,
        spread: 70,
        origin: { y: 0.5 },
        colors: ['#ff4d6d', '#ffd166', '#06d6a0', '#118ab2']
      });
    }

    // Close Paper Modal Letter
    function closeApologyLetter() {
      const modal = document.getElementById('letterModal');
      const paper = document.getElementById('paperLetter');

      paper.classList.remove('scale-100');
      paper.classList.add('scale-90');
      modal.classList.add('opacity-0', 'pointer-events-none');
    }

    // Handle Final Acceptance Button Click in Letter Modal
    function handleFinalAcceptClick() {
      // Send Second Email: Final Confirmation
      sendFormspreeData({
        event: "Final Acceptance Confirmed",
        message: "'လက်ခံပါတယ် အမြဲတမ်းအတူရှိမယ်' ဆိုတဲ့ ခလုတ်ကို နှိပ်လိုက်ပါပြီ!",
        time: new Date().toLocaleString()
      });

      closeApologyLetter();
    }

    window.onload = function() {
      createHearts();
    };
  </script>
</body>
</html>
